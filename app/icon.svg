<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#efc558" />
      <stop offset="50%" stop-color="#d4a843" />
      <stop offset="100%" stop-color="#9a7625" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#060606" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.35" />

  <!-- Elevation Studio Architectural Emblem -->
  <g transform="translate(256, 256)" filter="url(#goldGlow)">
    <!-- Base Foundation Line -->
    <path d="M-120 100 L120 100" stroke="url(#goldGrad)" stroke-width="28" stroke-linecap="round" />

    <!-- Middle Level Line -->
    <path d="M-80 20 L80 20" stroke="url(#goldGrad)" stroke-width="28" stroke-linecap="round" />

    <!-- Upper Level Line -->
    <path d="M-40 -60 L40 -60" stroke="url(#goldGrad)" stroke-width="28" stroke-linecap="round" />

    <!-- Apex Diamond -->
    <polygon points="0,-145 26,-115 0,-85 -26,-115" fill="url(#goldGrad)" />

    <!-- Vertical Spine Pillar -->
    <path d="M-100 100 L-100 -60" stroke="url(#goldGrad)" stroke-width="28" stroke-linecap="round" />
  </g>
</svg>
